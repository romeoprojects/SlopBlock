<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #0f0f0f;
      color: #e1e1e1;
    }
    h2 { font-size: 15px; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #888; margin-bottom: 14px; }
    .stat {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .stat strong { color: #fff; }
    a {
      display: block;
      text-align: center;
      padding: 10px;
      background: #dc2626;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    a:hover { background: #b91c1c; }
    .donate {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      font-size: 11px;
    }
    .donate:hover { background: #1a1a1a; color: #fff; }
  </style>
</head>
<body>
  <h2>AI Human Guard</h2>
  <p class="subtitle">We don't hide. We label.</p>
  <div class="stat">
    Tracking <strong id="count">—</strong> channels ·
    Updated <strong id="updated">—</strong>
  </div>
  <a href="https://github.com/YOUR_USERNAME/ai-slop-list/issues/new?template=report-channel.yml" target="_blank">
    ⚠ Report a Channel
  </a>
  <a class="donate" href="https://liberapay.com/YOUR_USERNAME" target="_blank">
    ♥ Support with a donation
  </a>
  <script src="popup.js"></script>
</body>
</html>
